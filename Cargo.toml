[workspace]
resolver = "2"
members = [
    "crates/traits",
    "crates/oci",
    "crates/core",
    "crates/cli",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Error handling
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Logging
chrono = "0.4"
colored = "2"

# OCI
oci-client = "0.15"

# Archive handling
flate2 = "1"
tar = "0.4"

# Auth & crypto
base64 = "0.22"
sha2 = "0.10"
dirs = "5"

# Validation
regex = "1"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Workspace crates
traits = { path = "crates/traits" }
oci = { path = "crates/oci" }
ociskills-core = { path = "crates/core" }
